name: Security scan

# OWASP ZAP baseline (0 high/medium), testssl.sh (TLS 1.3 only), HTTP -> HTTPS 301,
# all through the nginx reverse proxy from infra/docker-compose.yml.
# Action and image versions are pinned; Dependabot proposes upgrades for the actions.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  DEPLOY_ENV: ci

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v3.2.0
        with:
          cache: true
          require-lockfile: true
      - run: pnpm build

      - name: Start app (:3000) and nginx TLS 1.3 proxy (:8443, :8080)
        run: |
          pnpm start > app.log 2>&1 &
          pnpm dlx wait-on@9.5.1 -t 60000 http://localhost:3000/api/health
          docker compose -f infra/docker-compose.yml up -d nginx
          pnpm dlx wait-on@9.5.1 -t 60000 tcp:localhost:8443
          mkdir -p reports && chmod 777 reports

      - name: HTTP redirects to HTTPS with 301
        run: |
          read code location < <(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" http://localhost:8080/)
          echo "HTTP -> $code $location"
          test "$code" = "301" && [[ "$location" == https://* ]]

      - name: testssl.sh - only TLS 1.3
        run: |
          docker run --rm --network host -v "$PWD/reports:/out" drwetter/testssl.sh:3.2 \
            --protocols --quiet --jsonfile /out/testssl.json https://localhost:8443 || true
          node -e '
            const r = require("./reports/testssl.json");
            const get = (id) => (r.find((x) => x.id === id) || {}).finding || "missing";
            const bad = ["SSLv2","SSLv3","TLS1","TLS1_1","TLS1_2"].filter((p) => !/not offered/i.test(get(p)));
            const ok13 = /offered/i.test(get("TLS1_3")) && !/not offered/i.test(get("TLS1_3"));
            console.log({ TLS1_2: get("TLS1_2"), TLS1_3: get("TLS1_3") });
            if (bad.length || !ok13) { console.error("FAIL - old protocols offered:", bad, "TLS1.3 ok:", ok13); process.exit(1); }'

      - name: OWASP ZAP baseline - 0 high/medium alerts
        run: |
          docker run --rm --network host -v "$PWD/reports:/zap/wrk:rw" -v "$PWD/infra/zap:/zap/cfg:ro" \
            zaproxy/zap-stable:2.17.0 zap-baseline.py -t https://localhost:8443 \
            -c /zap/cfg/rules.tsv -J zap.json -r zap.html -I
          node -e '
            const r = require("./reports/zap.json");
            const alerts = (r.site || []).flatMap((s) => s.alerts || []);
            const bad = alerts.filter((a) => Number(a.riskcode) >= 2);
            for (const a of bad) console.error(`[${a.riskdesc}] ${a.name} (${a.pluginid})`);
            console.log(`${alerts.length} alerts, ${bad.length} high/medium`);
            process.exit(bad.length ? 1 : 0);'

      - name: Summary
        if: always()
        run: |
          {
            echo "### Security scan"
            echo "Result: ${{ job.status }}"
            echo "Evidence: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: security-reports
          path: |
            reports/
            app.log
          if-no-files-found: ignore
