# Local + CI infrastructure. `pnpm infra:up`, then `pnpm dev` on the host.
#   Postgres  :5432 one server, separate databases auth_db / session_db / engagement_db,
#                   each with its own roles (infra/postgres/init, src/db/databases.ts)
#   Mailpit   :1025 SMTP, :8025 web UI/API
#   nginx     :8443 HTTPS (TLS 1.3 only) -> app on host :3000; :8080 HTTP -> 301 to HTTPS
# DEV/CI PASSWORDS ONLY; staging/production use secrets.
name: ase-assignment

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.34
    ports: ["1025:1025", "8025:8025"]

  nginx-certs:
    image: alpine/openssl:3.5.9
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        [ -f /certs/localhost.crt ] ||
        openssl req -x509 -newkey rsa:2048 -nodes -days 825 -subj "/CN=localhost"
        -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
        -keyout /certs/localhost.key -out /certs/localhost.crt
    volumes:
      - nginxcerts:/certs

  nginx:
    image: nginx:1.31-alpine
    depends_on:
      nginx-certs:
        condition: service_completed_successfully
    ports: ["8443:8443", "8080:8080"]
    environment:
      APP_UPSTREAM: ${APP_UPSTREAM:-host.docker.internal:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - nginxcerts:/etc/nginx/certs:ro

volumes:
  pgdata:
  nginxcerts:
